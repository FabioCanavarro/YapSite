<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cba6f7" />
      <stop offset="100%" stop-color="#74c7ec" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="#1e1e2e" />
  <rect width="480" height="480" x="16" y="16" rx="112" fill="none" stroke="#313244" stroke-width="8" />

  <!-- Outer Soundwaves -->
  <circle cx="256" cy="256" r="150" fill="none" stroke="#74c7ec" stroke-width="4" stroke-dasharray="10 15" opacity="0.3" />
  <circle cx="256" cy="256" r="110" fill="none" stroke="#cba6f7" stroke-width="6" stroke-dasharray="5 10" opacity="0.5" />
  
  <!-- Glowing Center Mic -->
  <g filter="url(#glow)">
    <!-- Microphone Capsule -->
    <rect x="216" y="140" width="80" height="150" rx="40" fill="url(#grad)" />
    <!-- Stand / Cradle -->
    <path d="M 176,210 A 80,80 0 0,0 336,210" fill="none" stroke="#cdd6f4" stroke-width="12" stroke-linecap="round" />
    <path d="M 256,290 L 256,360" fill="none" stroke="#cdd6f4" stroke-width="12" />
    <path d="M 206,360 L 306,360" fill="none" stroke="#cdd6f4" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
